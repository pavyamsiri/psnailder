[workspace]
members = [
    "crates/psnailder_core",
    "py-psnailder",
    "crates/psnailder_tiktak",
    "crates/psnailder_fit",
    "crates/psnailder_mock",
]
resolver = "3"

[workspace.dependencies]
argmin = "0.11.0"
argmin-math = { version = "0.5.1", features = ["ndarray_latest"] }
argmin-observer-slog = "0.2.0"
argmin_testfunctions = "0.3.0"
itertools = "0.14.0"
ndarray = "0.16.0"
numpy = "0.28.0"
pyo3 = { version = "0.28.3" }
rand = "0.10.1"
sobol = "1.0.2"
sobol_burley = "0.5.0"

psnailder_core = { path = "crates/psnailder_core" }
psnailder_fit = { path = "crates/psnailder_fit" }
psnailder_mock = { path = "crates/psnailder_mock" }
psnailder_tiktak = { path = "crates/psnailder_tiktak" }

[profile.release]
debug = true

