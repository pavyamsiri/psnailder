[project]
name = "psnailder"
version = "0.1.8"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pavadol Yamsiri", email = "pavyamsiri@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.4.3",
    "optype[numpy]>=0.17.0",
    "scipy>=1.17.1",
    "scipy-stubs>=1.17.1.3",
]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.pyright]
typeCheckingMode = "strict"
deprecateTypingAliases = true
reportExplicitAny = false
reportAny = false
reportDeprecated = true
reportMissingParameterType = true
reportMissingTypeArgument = true
reportUnknownArgumentType = true
reportUnknownParameterType = true
reportUnknownVariableType = true
pythonVersion = "3.13"
exclude = [".venv"]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "D203",
    "D213",
    "ISC001",
    "PLR0913",
    "PLR0915",
    "PLR2004",
    "S101",
    "TD003",
    "C901",
]

[dependency-groups]
dev = [
    "matplotlib>=3.10.9",
    "maturin>=1.13.3",
    "phasmix",
    "pytest>=9.0.2",
    "rich>=15.0.0",
]

[tool.maturin]
module-name = "psnailder._internal"
features = ["pyo3/extension-module"]

[tool.uv]
cache-keys = [
    {file = "pyproject.toml"},
    {file = "Cargo.toml"},
    {file = "**/*.rs"},
    {file = "../crates/**/*.rs"},
]

[tool.uv.sources]
phasmix = { git = "https://github.com/pavyamsiri/phasmix.git" }
