[project]
name = "psnailder"
version = "0.1.8"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pavadol Yamsiri", email = "pavyamsiri@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.4.3",
    "optype[numpy]>=0.17.0",
    "scipy>=1.17.1",
    "scipy-stubs>=1.17.1.3",
]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.pyright]
typeCheckingMode = "strict"
deprecateTypingAliases = true
reportDeprecated = true
reportMissingParameterType = true
reportMissingTypeArgument = true
reportUnknownArgumentType = true
reportUnknownParameterType = true
reportUnknownVariableType = true
pythonVersion = "3.13"
exclude = [".venv"]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 130

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.maturin]
module-name = "psnailder._internal"
features = ["pyo3/extension-module"]

[tool.uv]
cache-keys = [
    {file = "pyproject.toml"},
    {file = "Cargo.toml"},
    {file = "**/*.rs"},
]
